`#include <iostream> 
using namespace std; 
 
// Function to compute factorial 
unsigned long long factorial(int n) { 
 
    if (n < 0) { 
        cout << "Factorial is not defined for negative numbers." 
             << endl; 
 
        return 0; 
    } 
 
    if (n == 0 || n == 1) { 
        return 1; 
    } 
 
    unsigned long long result = 1; 
 
    for (int i = 2; i <= n; ++i) { 
        result *= i; 
    } 
 
    return result; 
} 
 
int main() { 
 
    int n; 
 
    cout << "Input n for factorial function: "; 
    cin >> n; 
 
    unsigned long long result = factorial(n); 
 
    if (n >= 0) { 
        cout << "The factorial of integer " 
             << n 
             << " is: " 
             << result 
             << endl; 
    } 
 
    return 0; 
}`,

`

/* 
================================================== 
CURRENT DEMO 
================================================== 
*/ 
 
let currentDemo = 0; 
 
 
/* 
================================================== 
LOAD DEMO 
================================================== 
*/ 
 
function loadDemo(index) { 
 
    currentDemo = index; 
 
    const demo = demos[index]; 
 
    document.getElementById("code").value = 
        demo.code; 
 
    document.getElementById("infoTitle").textContent = 
        demo.title; 
 
    document.getElementById("explanation").innerHTML = 
        demo.explanation; 
 
    document.getElementById("output").textContent = 
        "Click ▶ Run C++ to start."; 
 
    /* 
    Highlight selected button 
    */ 
 
    const buttons = 
        document.querySelectorAll(".demo-btn"); 
 
    buttons.forEach(function(button) { 
        button.classList.remove("active"); 
    }); 
 
    buttons[index].classList.add("active"); 
 
} 
 
 
/* 
================================================== 
RUN CODE 
================================================== 
*/ 
 
function runCode() { 
 
    const demo = demos[currentDemo]; 
 
    const output = 
        document.getElementById("output"); 
 
    const input = 
        document.getElementById("userInput").value.trim(); 
 
 
    output.textContent = 
        "Compiling C++...\n"; 
 
 
    setTimeout(function() { 
 
        output.textContent = 
            "Program started...\n\n"; 
 
        runDemo(currentDemo, input); 
 
    }, 500); 
 
} 
 
 
/* 
================================================== 
RUN SELECTED DEMO 
================================================== 
*/ 
 
function runDemo(index, input) { 
 
    const output = 
        document.getElementById("output"); 
 
 
    /* 
    ============================================== 
    1. FACTORIAL 
    ============================================== 
    */ 
 
    if (index === 0) { 
 
        let n = parseInt(input); 
 
        if (isNaN(n)) { 
            n = 5; 
        } 
 
        if (n < 0) { 
 
            realtimeOutput([ 
                "Input n for factorial function: " + n, 
                "Factorial is not defined for negative numbers." 
            ]); 
 
            return; 
        } 
 
        let result = 1; 
 
        for (let i = 2; i <= n; i++) { 
            result *= i; 
        } 
 
        realtimeOutput([ 
            "Input n for factorial function: " + n, 
            "The factorial of integer " + 
            n + 
            " is: " + 
            result 
        ]); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    2. REVERSE NUMBER 
    ============================================== 
    */ 
 
    if (index === 1) { 
 
        let number = parseInt(input); 
 
        if (isNaN(number)) { 
            number = 12345; 
        } 
 
        let original = number; 
        let reverse = 0; 
 
        while (number !== 0) { 
 
            let remainder = number % 10; 
 
            reverse = 
                reverse * 10 + remainder; 
 
            number = 
                Math.trunc(number / 10); 
        } 
 
        realtimeOutput([ 
            "Enter a number: " + original, 
            "Reverse number: " + reverse 
        ]); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    3. CASE 
    ============================================== 
    */ 
 
    if (index === 2) { 
 
        let choice = parseInt(input); 
 
        if (isNaN(choice)) { 
            choice = 1; 
        } 
 
        let message; 
 
        switch (choice) { 
 
            case 1: 
                message = "You selected ONE."; 
                break; 
 
            case 2: 
                message = "You selected TWO."; 
                break; 
 
            case 3: 
                message = "You selected THREE."; 
                break; 
 
            default: 
                message = "Invalid choice."; 
        } 
 
        realtimeOutput([ 
            "Enter a number from 1 to 3: " + choice, 
            message 
        ]); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    4. GRADE 
    ============================================== 
    */ 
 
    if (index === 3) { 
 
        let score = parseInt(input); 
 
        if (isNaN(score)) { 
            score = 85; 
        } 
 
        let grade; 
 
        if (score >= 90) { 
            grade = "A"; 
        } 
        else if (score >= 80) { 
            grade = "B"; 
        } 
        else if (score >= 70) { 
            grade = "C"; 
        } 
        else if (score >= 60) { 
            grade = "D"; 
        } 
        else { 
            grade = "F"; 
        } 
 
        realtimeOutput([ 
            "Enter score: " + score, 
            "Grade: " + grade 
        ]); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    5. SORTING 
    ============================================== 
    */ 
 
    if (index === 4) { 
 
        let numbers = 
            [5, 2, 8, 1, 3]; 
 
        numbers.sort(function(a, b) { 
            return a - b; 
        }); 
 
        realtimeOutput([ 
            "Original numbers: 5 2 8 1 3", 
            "Sorted numbers: " + 
            numbers.join(" ") 
        ]); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    6. ARRAY 
    ============================================== 
    */ 
 
    if (index === 5) { 
 
        let numbers = 
            [10, 20, 30, 40, 50]; 
 
        let lines = 
            ["Array values:"]; 
 
        numbers.forEach(function(number) { 
            lines.push(String(number)); 
        }); 
 
        realtimeOutput(lines); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    7. SQUARE ARRAY 
    ============================================== 
    */ 
 
    if (index === 6) { 
 
        let numbers = 
            [1, 2, 3, 4, 5]; 
 
        let lines = 
            ["Square values:"]; 
 
        numbers.forEach(function(number) { 
 
            let square = 
                number * number; 
 
            lines.push( 
                number + "² = " + square 
            ); 
 
        }); 
 
        realtimeOutput(lines); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    8. STRING 
    ============================================== 
    */ 
 
    if (index === 7) { 
 
        let name = input; 
 
        if (name === "") { 
            name = "Student"; 
        } 
 
        realtimeOutput([ 
            "Enter your name: " + name, 
            "Hello, " + name + "!" 
        ]); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    9. ENTER GRADE 
    ============================================== 
    */ 
 
    if (index === 8) { 
 
        let grade = 
            input.toUpperCase(); 
 
        if (grade === "") { 
            grade = "A"; 
        } 
 
        let message; 
 
        switch (grade) { 
 
            case "A": 
                message = "Excellent!"; 
                break; 
 
            case "B": 
                message = "Very Good!"; 
                break; 
 
            case "C": 
                message = "Good!"; 
                break; 
 
            case "D": 
                message = "Needs Improvement."; 
                break; 
 
            case "F": 
                message = "Failed."; 
                break; 
 
            default: 
                message = "Invalid grade."; 
        } 
 
        realtimeOutput([ 
            "Enter grade: " + grade, 
            message 
        ]); 
 
        return; 
    } 
 
 
    /* 
    ============================================== 
    10. FLOAT 
    ============================================== 
    */ 
 
    if (index === 9) { 
 
        let price = 99.50; 
        let quantity = 3.0; 
 
        let total = 
            price * quantity; 
 
        realtimeOutput([ 
            "Price: " + 
            price.toFixed(2), 
 
            "Quantity: " + 
            quantity.toFixed(1), 
 
            "Total: " + 
            total.toFixed(2) 
        ]); 
 
        return; 
    } 
 
} 
 
 
/* 
================================================== 
REALTIME OUTPUT 
================================================== 
*/ 
 
function realtimeOutput(lines) { 
 
    const output = 
        document.getElementById("output"); 
 
    output.textContent = 
        ""; 
 
    lines.forEach(function(line, index) { 
 
        setTimeout(function() { 
 
            output.textContent += 
                line + "\n"; 
 
        }, index * 600); 
 
    }); 
 
    setTimeout(function() { 
 
        output.textContent += 
            "\n--- Program finished ---"; 
 
    }, lines.length * 600 + 200); 
 
} 
 
 
/* 
================================================== 
CLEAR OUTPUT 
================================================== 
*/ 
 
function clearOutput() { 
 
    document.getElementById("output") 
        .textContent = ""; 
 
}
